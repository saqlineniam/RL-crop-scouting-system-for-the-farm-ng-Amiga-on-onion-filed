[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "amiga-scout"
version = "0.1.0"
description = "Reinforcement learning for adaptive robotic crop scouting: a farm-ng Amiga learns where to measure in drone-mapped onion fields"
authors = [{ name = "Saqline Niam" }]
keywords = ["reinforcement learning", "agricultural robotics", "crop scouting", "precision agriculture", "farm-ng Amiga", "onion", "NDVI", "plant phenotyping", "simulation"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "gymnasium",
    "stable-baselines3",
    "sb3-contrib",
    "torch",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "pandas",
    "openpyxl",
    "rasterio",
    "pyshp",
]

[project.urls]
Repository = "https://github.com/saqlineniam/-RL-crop-scouting-system-for-the-farm-ng-Amiga-on-onion-filed"

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[project.scripts]
amiga-scout = "amiga_scout.cli:main"

[tool.setuptools.packages.find]
include = ["amiga_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
